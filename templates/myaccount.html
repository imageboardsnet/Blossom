<h2 class="text-center text-light mb-4">
    My Account
  </h2>
  <div class="card bg-dark text-light about">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Username</label>
          <input value="{{ user.username }}" type="text" class="form-control text-bg-dark" readonly>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date of Creation</label>
          <input value="{{ user.creation_date | humane_date }}" type="text" class="form-control text-bg-dark" readonly>
        </div>
      </div>
    <p class="mt-3 mb-3">Here you can manage your account settings:</p>
    <div class="d-flex gap-2">
      <a href="/user/reset/{{ user.id }}" class="btn btn-outline-secondary"><i class="bi bi-key-fill me-1"></i>Reset My Password</a>
      <a href="/user/delete/{{ user.id }}" class="btn btn-outline-danger"><i class="bi bi-trash3-fill me-1"></i>Delete My Account</a>
    </div>
  </div>
  </div>
