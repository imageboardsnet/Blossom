<h2 class="text-center text-light mb-4">
    Register
  </h2>
<div class="loginform card bg-dark text-light">
    <div class="card-header border-info text-center">
          Instant Registration™
    </div>
    <div class="card-body">

        <div class="alert alert-info">
             <p class="mb-2">Username</p>
             <div class="input-group mb-3 copy-input">
                <input type="text" value="{{ username }}" class="form-control text-bg-dark" readonly>
                <button class="btn btn-outline-info copy-btn" type="button">
                  <i class="bi bi-clipboard-check me-1"></i>Copy
                </button>
              </div>
             <p class="mb-2">Password</p>
             <div class="input-group copy-input">
                <input type="text" value="{{ password }}" class="form-control text-bg-dark" readonly>
                <button class="btn btn-outline-info copy-btn" type="button">
                  <i class="bi bi-clipboard-check me-1"></i>Copy
                </button>
              </div>
          </div>
          <a href="/login" class="btn btn-outline-info">Login</a>
        </div>
</div>
