<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta charset="UTF-8">
    <title>{{ title }} </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/style.css') }}">
    <script src="https://hcaptcha.com/1/api.js" async defer></script>
    
</head>

<body>
    <div id="page-container">
        <div id="content-wrap">
            {{ navbar |safe }}
            {{ content |safe }}
        </div>
        <footer class="footer-glass text-center text-light py-3">
            <div class="container">
                <small><a href="https://github.com/imageboardsnet/Lotus" class="link-light">Lotus 2.1.0</a> | ImageBoards.net | 2020 - 2026</small>
            </div>
        </footer>
        <button class="btn btn-info text-dark fw-semibold back-to-top" type="button" id="back-to-top">
            <i class="bi bi-arrow-up"></i>
        </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static',filename='js/main.js') }}" defer></script>
</body>
</html>
